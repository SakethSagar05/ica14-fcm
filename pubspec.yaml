name: ica14_fcm
description: "CSC 4360 In-Class Activity 14: Firebase Cloud Messaging in Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Course baseline: Firebase Core 4.x + Firebase Messaging 16.x (registration-token APIs).
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/default.png
    - assets/images/promo.png
